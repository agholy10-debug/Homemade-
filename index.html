<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>✨ 家事小幫手 ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .subtitle {
      text-align: center;
      color: #ffecd2;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .stars {
      text-align: center;
      font-size: 3em;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #764ba2;
      margin-bottom: 8px;
      font-size: 1.1em;
    }

    input, select {
      width: 100%;
      padding: 15px;
      border: 3px solid #667eea;
      border-radius: 12px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #764ba2;
    }

    .chore-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .chore-btn {
      padding: 15px 10px;
      border: 3px solid #667eea;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.3s;
      text-align: center;
    }

    .chore-btn:hover {
      background: #667eea;
      color: white;
    }

    .chore-btn.selected {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      transform: scale(1.05);
    }

    .chore-btn .emoji {
      display: block;
      font-size: 2em;
      margin-bottom: 5px;
    }

    .chore-btn .points {
      font-size: 0.8em;
      color: #666;
    }

    .chore-btn.selected .points {
      color: #ffecd2;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .records-title {
      color: white;
      text-align: center;
      font-size: 1.5em;
      margin: 30px 0 20px;
    }

    .record-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .record-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .record-emoji {
      font-size: 2.5em;
    }

    .record-details h3 {
      color: #764ba2;
      font-size: 1.2em;
    }

    .record-details p {
      color: #666;
      font-size: 0.9em;
    }

    .record-points {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.2em;
    }

    .total-points {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      text-align: center;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .total-points h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    .total-points .points-display {
      font-size: 3em;
      font-weight: bold;
    }

    .stats-btn {
      margin-top: 15px;
      padding: 12px 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      width: 100%;
    }

    .stats-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
      font-size: 1.2em;
      opacity: 0.9;
    }

    .empty-state {
      text-align: center;
      color: white;
      padding: 40px;
      opacity: 0.8;
    }

    .empty-state .emoji {
      font-size: 4em;
      margin-bottom: 15px;
    }

    .name-input {
      text-align: center;
    }

    .name-input input {
      text-align: center;
      font-size: 1.2em;
      padding: 12px;
    }

    .celebration {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5em;
      animation: pop 0.5s ease;
      z-index: 1000;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }

    .clear-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8em;
      margin-top: 10px;
    }

    .clear-btn:hover {
      background: #ee5a5a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 家事小幫手 ✨</h1>
    <p class="subtitle">幫爸媽做家事，賺星星點數！🌟</p>

    <div class="card">
      <div class="stars">⭐⭐⭐</div>
      
      <div class="form-group name-input">
        <label>👧👦 你的名字</label>
        <input type="text" id="childName" placeholder="輸入你的名字" maxlength="20">
      </div>

      <div class="form-group">
        <label>🍳 選擇家事項</label>
        <div class="chore-grid">
          <button class="chore-btn" onclick="selectChore(this, '洗碗', 10)">
            <span class="emoji">🍽️</span>
            洗碗
            <span class="points">+10</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '掃地', 10)">
            <span class="emoji">🧹</span>
            掃地
            <span class="points">+10</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '拖地', 15)">
            <span class="emoji">💦</span>
            拖地
            <span class="points">+15</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '疊衣服', 10)">
            <span class="emoji">👕</span>
            疊衣服
            <span class="points">+10</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '倒垃圾', 15)">
            <span class="emoji">🗑️</span>
            倒垃圾
            <span class="points">+15</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '整理房間', 20)">
            <span class="emoji">🛏️</span>
            整理房間
            <span class="points">+20</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '澆花', 5)">
            <span class="emoji">🌱</span>
            澆花
            <span class="points">+5</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '收衣服', 10)">
            <span class="emoji">👚</span>
            收衣服
            <span class="points">+10</span>
          </button>
          <button class="chore-btn" onclick="selectChore(this, '擦桌子', 8)">
            <span class="emoji">🧽</span>
            擦桌子
            <span class="points">+8</span>
          </button>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitChore()">
        🌟 完成家事！🌟
      </button>
    </div>

    <div class="total-points">
      <h2>🏆 我的總點數</h2>
      <div class="points-display" id="totalPoints">0</div>
      <div class="points-label">顆星星</div>
      <button class="stats-btn" id="statsBtn" onclick="showStats()">📊 查看統計</button>
    </div>

    <!-- 統計 Modal -->
    <div id="statsModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:2000;overflow-y:auto;">
      <div style="max-width:600px;margin:20px auto;padding:20px;">
        <div style="background:white;border-radius:20px;padding:25px;max-height:80vh;overflow-y:auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h2 style="color:#764ba2;">📊 家事統計</h2>
            <button onclick="hideStats()" style="background:#ff6b6b;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1.2em;">✕</button>
          </div>
          <div id="statsContent"></div>
        </div>
      </div>
    </div>

    <h2 class="records-title">📝 家事紀錄</h2>
    <div id="recordsContainer">
      <div class="empty-state">
        <div class="emoji">🎈</div>
        <p>還沒有家事記錄～<br>快去幫爸媽做家事吧！</p>
      </div>
    </div>
  </div>

  <div id="celebrationOverlay" class="overlay" style="display:none"></div>
  <div id="celebration" class="celebration" style="display:none">🎉</div>

  <script>
    // ==================== 資安增強 ====================
    
    // 允許的白名單字元（中文、英文、數字、空白）
    const ALLOWED_CHARS = /^[a-zA-Z0-9\u4e00-\u9fff\s]+$/;
    
    // 允許的家事項目（防範注入）
    const ALLOWED_CHORES = ['洗碗', '掃地', '拖地', '疊衣服', '倒垃圾', '整理房間', '澆花', '收衣服', '擦桌子'];
    
    /**
     * 消毒輸入 - 移除所有 HTML/JS 標籤和特殊字元
     */
    function sanitizeInput(str) {
      if (typeof str !== 'string') return '';
      
      // 移除 HTML 標籤
      let clean = str.replace(/<[^>]*>/g, '');
      
      // 跳脫 HTML 實體
      clean = clean
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
      
      // 移除潛在的 JavaScript 事件處理
      clean = clean.replace(/on\w+=/gi, '');
      clean = clean.replace(/javascript:/gi, '');
      clean = clean.replace(/data:/gi, '');
      
      return clean.trim();
    }
    
    /**
     * 消毒並驗證名字輸入
     */
    function sanitizeName(name) {
      if (typeof name !== 'string') return '';
      
      // 移除危險字元
      let clean = name
        .replace(/[<>'"&]/g, '')  // 移除危險字元
        .replace(/\s+/g, ' ')      // 合併空白
        .trim();
      
      // 限制長度
      if (clean.length > 20) {
        clean = clean.substring(0, 20);
      }
      
      // 驗證字元（只能有中文、英文、數字、空白）
      if (!ALLOWED_CHARS.test(clean)) {
        return '';
      }
      
      return clean;
    }
    
    /**
     * 驗證家事項目（防止注入）
     */
    function validateChore(chore) {
      return ALLOWED_CHORES.includes(chore);
    }
    
    /**
     * 驗證點數（防止數字操控）
     */
    function validatePoints(points) {
      const num = parseInt(points, 10);
      return !isNaN(num) && num > 0 && num <= 100;
    }
    
    /**
     * 安全地設置文字內容（防止 XSS）
     */
    function safeSetText(element, text) {
      element.textContent = text;
    }
    
    // ==================== 原有功能 ====================
    
    let selectedChore = null;
    let selectedPoints = 0;
    let totalPoints = 0;
    let records = [];

    function selectChore(btn, chore, points) {
      // 驗證輸入
      if (!validateChore(chore) || !validatePoints(points)) {
        console.warn('無效的家事項目');
        return;
      }
      
      document.querySelectorAll('.chore-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedChore = chore;
      selectedPoints = points;
    }

    function submitChore() {
      // 消毒名字輸入
      const rawName = document.getElementById('childName').value;
      const name = sanitizeName(rawName);
      
      if (!name) {
        alert('請輸入有效的名字喔！👧\n（只能使用中文、英文、數字）');
        return;
      }

      if (!selectedChore || !validateChore(selectedChore)) {
        alert('請選擇家事項！🍳');
        return;
      }

      if (!validatePoints(selectedPoints)) {
        alert('資料異常，請重新選擇！');
        return;
      }

      const record = {
        name: name,
        chore: selectedChore,
        points: selectedPoints,
        emoji: getEmoji(selectedChore),
        time: new Date().toLocaleString('zh-TW')
      };

      // 限制記錄數量（防止 localStorage 過大）
      if (records.length >= 100) {
        records.pop();  // 移除最舊的
      }

      records.unshift(record);
      totalPoints += selectedPoints;

      updateUI();
      showCelebration();

      // 重置表單（保留名字）
      document.getElementById('childName').value = name;
      document.querySelectorAll('.chore-btn').forEach(b => b.classList.remove('selected'));
      selectedChore = null;
      selectedPoints = 0;

      saveData();
    }

    function getEmoji(chore) {
      const emojis = {
        '洗碗': '🍽️', '掃地': '🧹', '拖地': '💦',
        '疊衣服': '👕', '倒垃圾': '🗑️', '整理房間': '🛏️',
        '澆花': '🌱', '收衣服': '👚', '擦桌子': '🧽'
      };
      return emojis[chore] || '✅';
    }

    function updateUI() {
      safeSetText(document.getElementById('totalPoints'), totalPoints);

      const container = document.getElementById('recordsContainer');
      
      if (records.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🎈</div>
            <p>還沒有家事記錄～<br>快去幫爸媽做家事吧！</p>
          </div>
        `;
        return;
      }

      // 使用 map 而非直接 innerHTML 拼接，更安全
      let html = '';
      for (let i = 0; i < records.length; i++) {
        const r = records[i];
        // 確保所有輸出都被跳脫
        const safeChore = sanitizeInput(r.chore);
        const safeName = sanitizeInput(r.name);
        const safeTime = sanitizeInput(r.time);
        
        html += `
          <div class="record-card" style="animation-delay: ${i * 0.05}s">
            <div class="record-info">
              <span class="record-emoji">${r.emoji}</span>
              <div class="record-details">
                <h3>${safeChore}</h3>
                <p>${safeName} · ${safeTime}</p>
              </div>
            </div>
            <div>
              <span class="record-points">+${r.points}</span>
              <button class="clear-btn" onclick="deleteRecord(${i})">刪除</button>
            </div>
          </div>`;
      }
      container.innerHTML = html;
    }

    function deleteRecord(index) {
      if (index >= 0 && index < records.length) {
        totalPoints -= records[index].points;
        records.splice(index, 1);
        updateUI();
        saveData();
      }
    }

    function showCelebration() {
      const overlay = document.getElementById('celebrationOverlay');
      const celebration = document.getElementById('celebration');
      const emojis = ['🎉', '🌟', '✨', '🏆', '👏', '💪'];
      
      overlay.style.display = 'block';
      celebration.style.display = 'block';
      celebration.textContent = emojis[Math.floor(Math.random() * emojis.length)];

      setTimeout(() => {
        overlay.style.display = 'none';
        celebration.style.display = 'none';
      }, 800);
    }

    function saveData() {
      try {
        // 確保資料是乾淨的才儲存
        const cleanData = {
          records: records.map(r => ({
            name: sanitizeInput(r.name),
            chore: sanitizeInput(r.chore),
            points: validatePoints(r.points) ? r.points : 0,
            emoji: sanitizeInput(r.emoji),
            time: sanitizeInput(r.time)
          })),
          totalPoints: validatePoints(totalPoints) ? totalPoints : 0
        };
        
        // 限制 localStorage 大小（最大 1MB）
        const jsonStr = JSON.stringify(cleanData);
        if (jsonStr.length > 1024 * 1024) {
          console.warn('資料量過大，僅保留最新記錄');
          cleanData.records = cleanData.records.slice(0, 50);
          cleanData.totalPoints = cleanData.records.reduce((sum, r) => sum + r.points, 0);
        }
        
        localStorage.setItem('choresRecords', JSON.stringify(cleanData));
      } catch (e) {
        console.error('儲存失敗:', e);
      }
    }

    function loadData() {
      try {
        const saved = localStorage.getItem('choresRecords');
        if (saved) {
          const data = JSON.parse(saved);
          
          // 驗證資料結構
          if (Array.isArray(data.records)) {
            // 消毒並驗證每一筆記錄
            records = data.records
              .filter(r => validateChore(r.chore) && validatePoints(r.points))
              .map(r => ({
                name: sanitizeInput(r.name || ''),
                chore: r.chore,
                points: r.points,
                emoji: sanitizeInput(r.emoji || ''),
                time: sanitizeInput(r.time || '')
              }));
          }
          
          // 驗證總點數
          totalPoints = validatePoints(data.totalPoints) ? data.totalPoints : 0;
          
          updateUI();
        }
      } catch (e) {
        console.error('讀取失敗:', e);
        // 資料損壞時清除
        localStorage.removeItem('choresRecords');
      }
    }

    // 防止過快點擊（防範機器人）
    let lastSubmitTime = 0;
    const SUBMIT_COOLDOWN = 1000; // 1秒冷卻

    const originalSubmit = submitChore;
    submitChore = function() {
      const now = Date.now();
      if (now - lastSubmitTime < SUBMIT_COOLDOWN) {
        alert('操作太頻繁，請稍等一下！😅');
        return;
      }
      lastSubmitTime = now;
      originalSubmit();
    };

    // 頁面載入時恢復資料
    loadData();
    
    // ==================== 統計功能 ====================
    
    function showStats() {
      const modal = document.getElementById('statsModal');
      const content = document.getElementById('statsContent');
      
      if (records.length === 0) {
        content.innerHTML = `
          <div style="text-align:center;padding:40px;color:#666;">
            <div style="font-size:4em;">📭</div>
            <p style="margin-top:15px;">目前沒有家事記錄</p>
          </div>
        `;
      } else {
        // 統計每個人
        const userStats = {};
        records.forEach(r => {
          if (!userStats[r.name]) {
            userStats[r.name] = { points: 0, count: 0 };
          }
          userStats[r.name].points += r.points;
          userStats[r.name].count += 1;
        });
        
        // 排序
        const sorted = Object.entries(userStats)
          .map(([name, stats]) => ({ name, ...stats }))
          .sort((a, b) => b.points - a.points);
        
        // 各家事統計
        const choreStats = {};
        records.forEach(r => {
          choreStats[r.chore] = (choreStats[r.chore] || 0) + 1;
        });
        
        content.innerHTML = `
          <div style="margin-bottom:25px;">
            <h3 style="color:#764ba2;margin-bottom:15px;">🏆 點數排行榜</h3>
            ${sorted.map((user, i) => `
              <div style="display:flex;align-items:center;padding:12px;background:${i===0?'#fff8e1':i===1?'#f5f5f5':i===2?'#fef3e2':'#f8f8f8'};border-radius:12px;margin-bottom:8px;">
                <div style="width:35px;height:35px;background:${i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#667eea'};color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;">${i+1}</div>
                <div style="flex:1;">
                  <div style="font-weight:bold;">${user.name}</div>
                  <div style="font-size:0.85em;color:#666;">完成 ${user.count} 次</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:1.4em;font-weight:bold;color:#764ba2;">${user.points}</div>
                  <div style="font-size:0.8em;color:#666;">點數</div>
                </div>
              </div>
            `).join('')}
          </div>
          
          <div style="margin-bottom:25px;">
            <h3 style="color:#764ba2;margin-bottom:15px;">📊 統計摘要</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div style="background:#f8f8f8;padding:15px;border-radius:12px;text-align:center;">
                <div style="font-size:2em;">📝</div>
                <div style="font-size:1.5em;font-weight:bold;color:#764ba2;">${records.length}</div>
                <div style="font-size:0.9em;color:#666;">總記錄</div>
              </div>
              <div style="background:#f8f8f8;padding:15px;border-radius:12px;text-align:center;">
                <div style="font-size:2em;">⭐</div>
                <div style="font-size:1.5em;font-weight:bold;color:#764ba2;">${totalPoints}</div>
                <div style="font-size:0.9em;color:#666;">總點數</div>
              </div>
            </div>
          </div>
          
          <div>
            <h3 style="color:#764ba2;margin-bottom:15px;">🍳 各項家事統計</h3>
            ${Object.entries(choreStats).sort((a,b)=>b[1]-a[1]).map(([chore, count]) => `
              <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;">
                <span>${chore}</span>
                <span style="font-weight:bold;color:#764ba2;">${count} 次</span>
              </div>
            `).join('')}
          </div>
        `;
      }
      
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }
    
    function hideStats() {
      const modal = document.getElementById('statsModal');
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }
    
    // 點擊背景關閉
    document.getElementById('statsModal').addEventListener('click', function(e) {
      if (e.target === this) hideStats();
    });
  </script>
</body>
</html>

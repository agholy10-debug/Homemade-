<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 家事小幫手 v2.0 ✨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 {
      text-align: center; color: white; font-size: 2.5em;
      margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      text-align: center; color: #ffecd2;
      margin-bottom: 30px; font-size: 1.1em;
    }
    .sync-badge {
      text-align: center; margin-bottom: 15px;
    }
    .sync-badge span {
      background: rgba(255,255,255,0.2); color: white;
      padding: 6px 16px; border-radius: 20px;
      font-size: 0.9em; display: inline-flex;
      align-items: center; gap: 6px;
    }
    .sync-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80; display: inline-block;
    }
    .sync-badge .dot.offline { background: #ef4444; }
    .card {
      background: white; border-radius: 20px;
      padding: 25px; margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .stars { text-align: center; font-size: 3em; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block; font-weight: bold;
      color: #764ba2; margin-bottom: 8px; font-size: 1.1em;
    }
    input, select {
      width: 100%; padding: 15px;
      border: 3px solid #667eea; border-radius: 12px;
      font-size: 1em; transition: border-color 0.3s;
    }
    input:focus, select:focus {
      outline: none; border-color: #764ba2;
    }
    .chore-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .chore-btn {
      padding: 15px 10px; border: 3px solid #667eea;
      border-radius: 12px; background: white;
      cursor: pointer; font-size: 0.9em;
      transition: all 0.3s; text-align: center;
    }
    .chore-btn:hover {
      background: #667eea; color: white;
    }
    .chore-btn.selected {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; transform: scale(1.05);
    }
    .chore-btn .emoji { display: block; font-size: 2em; margin-bottom: 5px; }
    .chore-btn .points { font-size: 0.8em; color: #666; }
    .chore-btn.selected .points { color: #ffecd2; }
    .submit-btn {
      width: 100%; padding: 18px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white; border: none; border-radius: 12px;
      font-size: 1.3em; font-weight: bold;
      cursor: pointer; transition: all 0.3s;
    }
    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .submit-btn:disabled {
      background: #ccc; cursor: not-allowed; transform: none;
    }
    .records-title {
      color: white; text-align: center;
      font-size: 1.5em; margin: 30px 0 20px;
    }
    .record-card {
      background: white; border-radius: 15px; padding: 20px;
      margin-bottom: 15px; display: flex;
      align-items: center; justify-content: space-between;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .record-info { display: flex; align-items: center; gap: 15px; }
    .record-emoji { font-size: 2.5em; }
    .record-details h3 { color: #764ba2; font-size: 1.2em; }
    .record-details p { color: #666; font-size: 0.9em; }
    .record-points {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 8px 16px; border-radius: 20px;
      font-weight: bold; font-size: 1.1em;
    }
    .clear-btn {
      background: #ff6b6b; color: white; border: none;
      padding: 6px 12px; border-radius: 8px;
      cursor: pointer; font-size: 0.8em; margin-top: 5px;
    }
    .loading {
      text-align: center; color: white; padding: 40px;
    }
    .empty-state {
      text-align: center; padding: 40px; color: #666;
    }
    .empty-state .emoji { font-size: 4em; }
    .stats-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; padding: 12px 24px;
      border-radius: 25px; font-size: 1em; cursor: pointer;
      margin: 20px auto; display: block;
    }
    .refresh-btn {
      background: rgba(255,255,255,0.2); color: white;
      border: 2px solid white; padding: 8px 16px;
      border-radius: 20px; font-size: 0.9em; cursor: pointer;
      margin: 10px auto; display: block;
    }
    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      z-index: 100; overflow-y: auto;
    }
    .modal-content {
      background: white; border-radius: 20px;
      padding: 30px; max-width: 500px; margin: 50px auto;
      position: relative;
    }
    .close-btn {
      position: absolute; top: 15px; right: 20px;
      font-size: 1.5em; cursor: pointer; color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 家事小幫手 ✨</h1>
    <div class="subtitle">做家事 · 賺點數 · 一起快樂！</div>
    
    <div class="sync-badge">
      <span>
        <span class="dot" id="syncDot"></span>
        <span id="syncText">🌐 同步中...</span>
      </span>
    </div>

    <div class="card">
      <div class="stars">⭐ 總點數：<span id="totalPoints">0</span> ⭐</div>
      
      <div class="form-group">
        <label>👧 小朋友名字</label>
        <input type="text" id="childName" placeholder="請輸入名字..." maxlength="20">
      </div>

      <div class="form-group">
        <label>🍳 選擇家事</label>
        <div class="chore-grid" id="choreGrid"></div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitChore()">✅ 確認送出 +10分</button>
      <button class="refresh-btn" onclick="loadFromServer()">🔄 刷新資料</button>
    </div>

    <button class="stats-btn" onclick="showStats()">📊 查看統計</button>

    <div class="records-title">📋 家事記錄</div>
    <div id="recordsContainer">
      <div class="loading">載入中...</div>
    </div>
  </div>

  <div class="modal" id="statsModal">
    <div class="modal-content">
      <span class="close-btn" onclick="hideStats()">×</span>
      <div id="statsContent"></div>
    </div>
  </div>

  <script>
    // ==================== 配置 ====================
    // ⚠️ 重要：部署後請把這裡改成你的伺服器網址！
    const API_BASE = '/api';
    
    // 若部署到 Render / Railway，改成：
    // const API_BASE = 'https://你的專案名稱.onrender.com/api';
    
    let records = [];
    let totalPoints = 0;
    let selectedChore = null;
    let selectedPoints = 0;

    // ==================== 家事選項 ====================
    const CHORES = {
      '洗碗': 10, '掃地': 10, '拖地': 15,
      '疊衣服': 10, '倒垃圾': 10, '整理房間': 15,
      '澆花': 10, '收衣服': 10, '擦桌子': 10,
      '買早餐': 10, '洗衣服': 15, '煮飯': 20,
      '切水果': 10, '洗廁所': 15
    };

    const EMOJIS = {
      '洗碗': '🍽️', '掃地': '🧹', '拖地': '💦',
      '疊衣服': '👕', '倒垃圾': '🗑️', '整理房間': '🛏️',
      '澆花': '🌱', '收衣服': '👚', '擦桌子': '🧽',
      '買早餐': '🥪', '洗衣服': '👕', '煮飯': '🍳',
      '切水果': '🍎', '洗廁所': '🚽'
    };

    // ==================== 初始化 ====================
    function initChoreGrid() {
      const grid = document.getElementById('choreGrid');
      grid.innerHTML = '';
      
      Object.entries(CHORES).forEach(([chore, points]) => {
        const btn = document.createElement('button');
        btn.className = 'chore-btn';
        btn.innerHTML = `
          <span class="emoji">${EMOJIS[chore]}</span>
          ${chore}
          <span class="points">+${points}分</span>
        `;
        btn.onclick = () => selectChore(btn, chore, points);
        grid.appendChild(btn);
      });
    }

    function selectChore(btn, chore, points) {
      document.querySelectorAll('.chore-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedChore = chore;
      selectedPoints = points;
      document.getElementById('submitBtn').textContent = `✅ 確認送出 +${points}分`;
    }

    // ==================== API 呼叫 ====================
    async function loadFromServer() {
      setSyncStatus(true, '同步中...');
      try {
        const res = await fetch(`${API_BASE}/chores`);
        const data = await res.json();
        
        if (data.success) {
          records = data.records || [];
          totalPoints = data.totalPoints || 0;
          updateUI();
          setSyncStatus(true, '🌐 已同步');
        }
      } catch (err) {
        console.error('載入失敗:', err);
        setSyncStatus(false, '❌ 離線模式');
        // 離線時使用 localStorage 備份
        loadFromLocal();
      }
    }

    async function submitChore() {
      const name = document.getElementById('childName').value.trim();
      
      if (!name) {
        alert('請輸入名字喔！👧');
        return;
      }
      if (!selectedChore) {
        alert('請選擇家事項目！🍳');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '送出中...';

      try {
        const res = await fetch(`${API_BASE}/chores`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            chore: selectedChore,
            points: selectedPoints,
            emoji: EMOJIS[selectedChore]
          })
        });

        const data = await res.json();

        if (data.success) {
          records.unshift(data.record);
          totalPoints = data.totalPoints;
          updateUI();
          showCelebration();
          
          // 重置
          document.querySelectorAll('.chore-btn').forEach(b => b.classList.remove('selected'));
          selectedChore = null;
          selectedPoints = 0;
          btn.textContent = '✅ 確認送出 +10分';
        } else {
          alert('送出失敗：' + data.message);
        }
      } catch (err) {
        console.error('送出失敗:', err);
        alert('網路連線失敗，請檢查伺服器是否運行中！');
      }

      btn.disabled = false;
    }

    async function deleteRecord(id) {
      if (!confirm('確定要刪除這筆記錄嗎？')) return;
      
      try {
        const res = await fetch(`${API_BASE}/chores/${id}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        
        if (data.success) {
          records = records.filter(r => r.id !== id);
          totalPoints = data.totalPoints;
          updateUI();
        }
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }

    // ==================== UI 更新 ====================
    function updateUI() {
      document.getElementById('totalPoints').textContent = totalPoints;
      
      const container = document.getElementById('recordsContainer');
      
      if (records.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🎈</div>
            <p>還沒有家事記錄～<br>快去幫爸媽做家事吧！</p>
          </div>`;
        return;
      }

      container.innerHTML = records.map((r, i) => `
        <div class="record-card" style="animation-delay: ${i * 0.05}s">
          <div class="record-info">
            <span class="record-emoji">${r.emoji}</span>
            <div class="record-details">
              <h3>${escapeHtml(r.chore)}</h3>
              <p>${escapeHtml(r.name)} · ${escapeHtml(r.time)}</p>
            </div>
          </div>
          <div>
            <span class="record-points">+${r.points}</span>
            <button class="clear-btn" onclick="deleteRecord('${r.id}')">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function setSyncStatus(online, text) {
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      if (online) {
        dot.classList.remove('offline');
      } else {
        dot.classList.add('offline');
      }
      txt.textContent = text;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showCelebration() {
      const emojis = ['🎉', '🌟', '✨', '🏆', '👏', '💪'];
      const popup = document.createElement('div');
      popup.style.cssText = `
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 5em; z-index: 1000;
        animation: popIn 0.5s ease;
      `;
      popup.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 800);
    }

    // ==================== 統計 ====================
    function showStats() {
      const modal = document.getElementById('statsModal');
      const content = document.getElementById('statsContent');
      
      if (records.length === 0) {
        content.innerHTML = `
          <div style="text-align:center;padding:40px;color:#666;">
            <div style="font-size:4em;">📭</div>
            <p>目前沒有家事記錄</p>
          </div>`;
      } else {
        const userStats = {};
        const choreStats = {};
        
        records.forEach(r => {
          if (!userStats[r.name]) userStats[r.name] = { points: 0, count: 0 };
          userStats[r.name].points += r.points;
          userStats[r.name].count++;
          choreStats[r.chore] = (choreStats[r.chore] || 0) + 1;
        });
        
        const sorted = Object.entries(userStats)
          .map(([name, s]) => ({ name, ...s }))
          .sort((a, b) => b.points - a.points);

        content.innerHTML = `
          <div style="margin-bottom:25px;">
            <h3 style="color:#764ba2;margin-bottom:15px;">🏆 點數排行榜</h3>
            ${sorted.map((u, i) => `
              <div style="display:flex;align-items:center;padding:12px;background:${i===0?'#fff8e1':i===1?'#f5f5f5':i===2?'#fef3e2':'#f8f8f8'};border-radius:12px;margin-bottom:8px;">
                <div style="width:35px;height:35px;background:${i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'#667eea'};color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;">${i+1}</div>
                <div style="flex:1;">
                  <div style="font-weight:bold;">${escapeHtml(u.name)}</div>
                  <div style="font-size:0.85em;color:#666;">完成 ${u.count} 次</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:1.4em;font-weight:bold;color:#764ba2;">${u.points}</div>
                </div>
              </div>
            `).join('')}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:25px;">
            <div style="background:#f8f8f8;padding:15px;border-radius:12px;text-align:center;">
              <div style="font-size:2em;">📝</div>
              <div style="font-size:1.5em;font-weight:bold;color:#764ba2;">${records.length}</div>
              <div style="font-size:0.9em;color:#666;">總記錄</div>
            </div>
            <div style="background:#f8f8f8;padding:15px;border-radius:12px;text-align:center;">
              <div style="font-size:2em;">⭐</div>
              <div style="font-size:1.5em;font-weight:bold;color:#764ba2;">${totalPoints}</div>
              <div style="font-size:0.9em;color:#666;">總點數</div>
            </div>
          </div>
          <div>
            <h3 style="color:#764ba2;margin-bottom:15px;">🍳 各項家事統計</h3>
            ${Object.entries(choreStats).sort((a,b)=>b[1]-a[1]).map(([c,n]) => `
              <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;">
                <span>${escapeHtml(c)}</span>
                <span style="font-weight:bold;color:#764ba2;">${n} 次</span>
              </div>
            `).join('')}
          </div>
        `;
      }
      
      modal.style.display = 'block';
    }

    function hideStats() {
      document.getElementById('statsModal').style.display = 'none';
    }

    // ==================== 本地備份（離線用）====================
    function loadFromLocal() {
      try {
        const saved = localStorage.getItem('choresRecords');
        if (saved) {
          const data = JSON.parse(saved);
          records = data.records || [];
          totalPoints = data.totalPoints || 0;
          updateUI();
        }
      } catch(e) {}
    }

    function saveToLocal() {
      localStorage.setItem('choresRecords', JSON.stringify({ records, totalPoints }));
    }

    // 定期同步（每 30 秒自動刷新）
    setInterval(() => {
      loadFromServer();
    }, 30000);

    // ==================== 啟動 ====================
    initChoreGrid();
    loadFromServer();
  </script>
</body>
</html>
